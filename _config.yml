# ---- Theme ----
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai

# ---- Site Info ----
title: Belle小冷
tagline: 记录技术与生活
description: >-
  Belle小冷的个人博客，分享技术探索、项目实践与生活随笔。

url: ""
baseurl: ""

# ---- Appearance ----
avatar: /assets/img/avatar.jpg
theme_mode: light

# ---- Social ----
social:
  name: Belle小冷
  email: gyy616@vip.qq.com
  links:
    - https://github.com/TommyGyy

github:
  username: TommyGyy

# ---- Collections ----
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ---- Page Settings ----
page_views: false         # Disable PV counter (no 3rd-party script)
reading_time: true        # Show estimated reading time
back_to_top: true         # Show back-to-top button
toc: true                 # Table of contents in posts

# ---- Pagination ----
paginate: 10
