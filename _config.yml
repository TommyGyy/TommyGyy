# ---- Theme ----
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai

# ---- Site Info ----
title: Belle小冷
tagline: 我梦寐以求的是真爱和自由
description: >-
  Belle小冷的个人博客，可可托海滑雪主播，分享滑雪、户外探险与生活中的美好瞬间。将军山最美夕阳，热爱山海与自由。

url: ""
baseurl: "/TommyGyy"

# ---- Appearance ----
avatar: /assets/img/avatar.jpg
theme_mode: light

# ---- Social ----
social:
  name: Belle小冷
  email: gyy616@vip.qq.com
  links:
    - https://github.com/TommyGyy

github:
  username: TommyGyy

# ---- Collections ----
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ---- Page Settings ----
page_views: false         # Disable PV counter (no 3rd-party script)
reading_time: true        # Show estimated reading time
back_to_top: true         # Show back-to-top button
toc: true                 # Table of contents in posts

# ---- Pagination ----
paginate: 10

# ---- Future Posts ----
future: true
